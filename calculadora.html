<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculadora de Receita Agrícola</title>
<style>
  :root{--bg:#0f1115;--card:#fff;--text:#111;--accent:#0ea5e9;--muted:#667085}
  body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}
  header{background:blue(--accent);color:#fff;padding:16px}
  h1{margin:0;font-size:18px}
  .wrap{max-width:900px;margin:18px auto;padding:0 16px}
  .card{background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:16px}
  textarea,input{width:100%;box-sizing:border-box;border:1px solid #e4e7ec;border-radius:10px;padding:12px;font-size:15px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
  button.secondary{background:#eef2f6;color:#0f172a}
  .result{margin-top:16px}
  .meta{color:var(--muted);font-size:14px;margin-bottom:8px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #eef2f6;border-radius:10px;overflow:hidden}
  th,td{padding:10px;border-bottom:1px solid #f2f4f7;text-align:left;font-size:14px}
  th{background:#f8fafc;font-weight:700}
  .summaryTitle{font-weight:800;margin:6px 0 12px 0}
  .badge{display:inline-block;background:#f1f5f9;color:#0f172a;border:1px solid #e2e8f0;border-radius:999px;padding:4px 10px;font-size:12px;margin-right:6px}
  footer{color:#cbd5e1;text-align:center;padding:20px;font-size:12px}
</style>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    position: relative;
  }

  .fundo {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('lavoura.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0.3; /* 30% visível */
    z-index: -1;
  }
</style>
</head>
<!-- Adicione isso no <head> do seu HTML -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<body>
<div class="fundo"></div>
  <!-- Conteúdo da página vem aqui -->
<header><h1>Calculadora de Receita Agrícola</h1></header>

<div class="wrap">
  <div class="card">
    <div class="meta">Cole a receita (texto livre). Exemplo:</div>
    <pre style="white-space:pre-wrap;border:1px solid #eee;padding:8px;border-radius:8px;background:#fafafa">
Fazenda Talismã
Dessecação Pré Plantio
Talhões 4,5,6,7,8,9 (gradeados)

Brandt Becatron 50 ml
Speak Max 600 gr
Metraro 1.2 lt
Brandt Trietek 400 ml

30 hectares
    </pre>

    <textarea id="entrada" rows="8" placeholder="Cole aqui o texto com fazenda, operação, talhões, produtos e doses, e a área total..."></textarea>

    <div class="row" style="margin-top:12px">
      <div>
        <label class="meta">Área (ha) — opcional:</label>
        <input id="areaInput" type="number" step="0.01" placeholder="Ex.: 30">
      </div>
      <div>
        <label class="meta">Título opcional do resumo:</label>
        <input id="tituloInput" type="text" placeholder="Ex.: Dessecação Pré-Plantio">
      </div>
    </div>

    <div class="actions">
      <button onclick="calcular()">Calcular</button>
      <button class="secondary" onclick="copiarResumo()">Copiar resumo</button>
      <!-- Adicione este botão onde estão os botões de ação -->
<button onclick="compartilharImagemWhatsApp()">Compartilhar imagem WhatsApp</button>
      <button class="secondary" onclick="baixarPDF()">Baixar PDF</button>
    </div>

    <div id="resumo" class="result"></div>
  </div>
</div>

<footer>Gerado localmente — salve como index.html e abra no navegador.</footer>

<script>
/* Conversão de unidades para base: volume=L, massa=kg */
const unitToBase = {
  "l": v => v, "lt": v => v, "litro": v => v, "litros": v => v, "ml": v => v/1000,
  "kg": v => v, "g": v => v/1000, "gr": v => v/1000
};
const unitKind = {
  "l":"volume","lt":"volume","litro":"volume","litros":"volume","ml":"volume",
  "kg":"mass","g":"mass","gr":"mass"
};
function formatQty(value, kind){
  if (kind === "volume") return value >= 1 ? `${value.toFixed(2)} L` : `${(value*1000).toFixed(0)} ml`;
  if (kind === "mass")   return value >= 1 ? `${value.toFixed(2)} kg` : `${(value*1000).toFixed(0)} g`;
  return `${value.toFixed(2)} (un)`;
}

/* Detecta área dentro do texto (30 ha, 30 hectares) */
function detectArea(text){
  const re = /(\d+(?:[.,]\d+)?)\s*(ha|hectare|hectares)\b/i;
  const m = text.match(re);
  return m ? parseFloat(m[1].replace(',','.')) : null;
}

/* Extrai metadados simples */
function parseMeta(text){
  const oneLine = s => s ? s.trim().replace(/\s+/g,' ') : null;
  const fazenda = (text.match(/fazenda\s*([^\n]+)/i)||[])[1];
  const operacao = (text.match(/dessecação|dessecacao|operação|operacao\s*([^\n]+)/i)||[])[1];
  const talhoesMatch = text.match(/talh(ões|oes|ao)\s*([^\n]+)/i);
  const talhoes = talhoesMatch ? talhoesMatch[2].replace(/`\(.*?\)`/g,'').trim() : null;
  return { fazenda: oneLine(fazenda), operacao: oneLine(operacao), talhoes: oneLine(talhoes) };
}

/* Parser robusto de produtos: pega 'Nome 50 ml' em linhas ou trechos */
function parseProducts(text){
  const chunks = text.split(/\n/).map(s=>s.trim()).filter(Boolean);
  const items = [];
  const doseRegex = /(.+?)\s+([\d]+(?:[.,]\d+)?)\s*(ml|l|lt|litro|litros|g|gr|kg)\b/i;

  chunks.forEach(line=>{
    const m = line.match(doseRegex);
    if (!m) return;
    const name = m[1].trim().replace(/[.\-–:]+$/,'');
    const val = parseFloat(m[2].replace(',','.'));
    const unit = m[3].toLowerCase();

    const kind = unitKind[unit] || "volume";
    const toBase = unitToBase[unit] || (v=>v);
    const dosePerHa = toBase(val);

    // ignora linhas que claramente não são produto (mas sem bloquear produtos com acentos)
    if (/^(fazenda|talh(ões|oes|ao)|área|area|dessecação|dessecacao|operação|operacao)$/i.test(name)) return;

    items.push({ name, dosePerHa, kind, unit });
  });
  return items;
}

/* Cálculo dos totais */
function calcularTotais(items, area){
  return items.map(it=>{
    const total = it.dosePerHa * area;
    return { ...it, totalFormatted: formatQty(total, it.kind) };
  });
}

/* Render do resumo */
function renderResumo(meta, area, lista, tituloOptional){
  const titulo = tituloOptional || (meta.operacao || "Resumo da mistura");
  const fazenda = meta.fazenda ? `<span class="badge">Fazenda: ${meta.fazenda}</span>` : "";
  const talhoes = meta.talhoes ? `<span class="badge">Talhões: ${meta.talhoes}</span>` : "";
  const areaTag = `<span class="badge">Área: ${area} ha</span>`;

  let html = `
    <div class="summaryTitle">✅ ${titulo} — ${area} ha</div>
    <div style="margin-bottom:10px">${fazenda}${talhoes}${areaTag}</div>
    <table><thead><tr><th>Produto</th><th>Quantidade total</th></tr></thead><tbody>
  `;
  lista.forEach(r=>{ html += `<tr><td>${r.name}</td><td>${r.totalFormatted}</td></tr>`; });
  html += `</tbody></table>`;
  document.getElementById('resumo').innerHTML = html;
}

/* Fluxo principal */
function calcular(){
  const texto = document.getElementById('entrada').value;
  const areaInput = parseFloat(document.getElementById('areaInput').value);
  const areaDetected = detectArea(texto);
  const area = !isNaN(areaInput) && areaInput > 0 ? areaInput : (areaDetected || 0);

  if (!texto.trim()){ alert("Cole o texto da receita."); return; }
  if (!area){ alert("Informe a área (ha) no texto (ex.: '30 hectares') ou no campo ao lado."); return; }

  const meta = parseMeta(texto);
  const items = parseProducts(texto);
  if (!items.length){
    alert("Não encontrei produtos/doses. Use linhas no formato: 'Nome 50 ml' ou 'Nome 600 gr'.");
    return;
  }
  const totais = calcularTotais(items, area);
  renderResumo(meta, area, totais, document.getElementById('tituloInput').value);
}

/* Copiar resumo (texto) */
function copiarResumo(){
  const el = document.getElementById('resumo');
  if(!el.innerHTML){ alert("Calcule primeiro."); return; }

  // pega todas as linhas da tabela
  const rows = el.querySelectorAll("tbody tr");
  let texto = "";

  rows.forEach(r=>{
    const produto = r.children[0].innerText.trim();
    const qtd = r.children[1].innerText.trim();
    texto += `${produto} - ${qtd}\n`;
  });

  navigator.clipboard.writeText(texto.trim()).then(()=>alert("Resumo copiado com traço entre produto e quantidade."));
}


/* WhatsApp */
// Adicione esta função dentro da <script> do seu HTML
function compartilharImagemWhatsApp(){
  const el = document.getElementById('resumo');
  if(!el){ alert("Calcule primeiro."); return; }

  html2canvas(el).then(canvas => {
    canvas.toBlob(blob => {
      const file = new File([blob], "resumo.png", { type: "image/png" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({
          files: [file],
          title: "Resumo da Mistura",
          text: "Confira o resumo da mistura para aplicação",
        });
      } else {
        alert("Seu navegador não suporta compartilhamento de imagem. Use celular Android ou iPhone.");
      }
    });
  });
}


/* PDF (impressão) */
function baixarPDF(){
  const el = document.getElementById('resumo');
  if(!el.innerHTML){ alert("Calcule primeiro."); return; }
  const w = window.open("", "_blank");
  w.document.write(`
    <html><head><title>Resumo da mistura</title>
      <style>
        body{font-family:Arial,sans-serif;padding:20px}
        h2{margin:0 0 12px 0}
        table{width:100%;border-collapse:collapse}
        th,td{border:1px solid #ddd;padding:8px;text-align:left}
        th{background:#f2f2f2}
      </style>
    </head><body>
      <h2>Resumo da mistura</h2>
      ${el.innerHTML}
    </body></html>
  `);
  w.document.close(); w.focus(); w.print();
}
</script>
</body>
</html>
